name: Verify LATTICE

on:
  push:
    branches: [main, 'arena/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  laws:
    name: Kernel laws and starter policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install package
        run: python -m pip install .
      - name: Run deterministic law and corpus suite
        run: python -m unittest discover -s tests -v
      - name: Validate starter policy
        run: lat lint policies/packs/survival/policy.json
